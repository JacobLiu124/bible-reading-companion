name: Bug report
description: Something isn't working as expected
labels: ["type: bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Today
        2. Tap "I read it"
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Today and streaks, Groups, Posts and replies, Moderation, Accounts and settings, Other]
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: Chrome on Android, Safari on iPhone 15…
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
