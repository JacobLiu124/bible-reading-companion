name: Feature request
description: Suggest an idea or improvement
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who is it for, and what are they trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: How will we know it's done?
      description: A few acceptance criteria.
      placeholder: |
        - [ ] ...
